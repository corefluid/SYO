
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Core Flow Animations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: white;
      color: black;
    }

    /* Main title */
    h2 {
      font-size: clamp(22px, 2.5vw, 36px);
      text-align: center;
      margin: 0 0 25px;
    }

    /* Animation titles */
    h3 {
      font-size: clamp(18px, 1.8vw, 26px);
      text-align: center;
      margin: 0;
      padding-bottom: 5px;
    }

    /* Main layout: left:right = 2:1 */
    .video-container {
      display: grid;
      grid-template-columns:
        minmax(0, 2fr) minmax(0, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start;
    }

    /* Left column */
    .video-box-left {
      display: grid;
      grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 10px;
      height: clamp(500px, 60vw, 800px);
      min-width: 0;
    }

    /* Animation sections */
    .animation1,
    .animation3 {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    /* Video display area */
    .media {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .animation3 .media{
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .animation video{
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* All videos */
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 5px;
    }

    /* Right column */
    .video-box-right {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .video-box-right video {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Mobile layout */
    @media (max-width: 768px) {

      body {
        padding: 12px;
      }

      .video-container {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .video-box-left {
        display: flex;
        flex-direction: column;
        height: auto;
      }

      .animation1,
      .animation3 {
        flex: none;
      }

      .media {
        display: block;
        overflow: visible;
      }

      video {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <h2>
    SYO in Core Surface Flow Model GJI2023 (1982–2019)
  </h2>

  <div class="video-container">

    <!-- LEFT COLUMN -->
    <div class="video-box-left">

      <!-- Animation 1: Flow map -->
      <div class="animation1">

        <h3>Flow map</h3>

        <div class="media">
          <video
            controls
            autoplay
            muted
            loop
            playsinline
            preload="auto">

            <source
              src="animation_dBr_mean.mp4"
              type="video/mp4">

            Your browser does not support HTML5 video.
          </video>
        </div>

      </div>

      <!-- Animation 3: Equatorial zonal flow -->
      <div class="animation3">

        <h3>Equatorial zonal flow</h3>

        <div class="media">
          <video
            controls
            autoplay
            muted
            loop
            playsinline
            preload="auto">

            <source
              src="zonal_equator.mp4"
              type="video/mp4">

            Your browser does not support HTML5 video.
          </video>
        </div>

      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="video-box-right">

      <h3>Zonal flow</h3>

      <video
        controls
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
          src="zonal_animation.mp4"
          type="video/mp4">

        Your browser does not support HTML5 video.
      </video>

    </div>

  </div>

</body>
</html>
