<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Core Flow Animations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    h3 {
      font-size: 28px;
      margin: 0 0 10px;
    }

    /* Main layout: left:right = 2:1 */
    .video-container {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start;
    }

    /* Left column */
    .video-box-left {
      display: grid;
      grid-template-rows: 2fr 1fr;
      gap: 20px;
      min-width: 0;
      aspect-ratio: 4 / 3;
    }

    /* Two animation blocks */
    .animation1,
    .animation3 {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    /* Media area */
    .media {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Videos and GIF */
    video,
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 5px;
    }

    /* Right column */
    .video-box-right {
      min-width: 0;
    }

    .video-box-right video {
      width: 100%;
      height: auto;
    }

    /* Mobile layout */
    @media (max-width: 768px) {
      .video-container {
        grid-template-columns: 1fr;
      }

      .video-box-left {
        display: flex;
        flex-direction: column;
        aspect-ratio: auto;
      }

      .animation1,
      .animation3 {
        flex: none;
      }

      .media {
        display: block;
        overflow: visible;
      }

      video,
      img {
        width: 100%;
        height: auto;
      }

      h2 {
        font-size: 26px;
      }

      h3 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <h2>SYO in Core Surface Flow Model GJI2023 (1982–2019)</h2>

  <div class="video-container">

    <!-- Left column -->
    <div class="video-box-left">

      <!-- Animation 1: Flow map -->
      <div class="animation1">
        <h3>Flow map</h3>
        <div class="media">
          <video controls autoplay muted loop playsinline>
            <source src="animation_dBr_mean.mp4"
                    type="video/mp4">
            Your browser does not support HTML5 video.
          </video>
        </div>
      </div>

      <!-- Animation 3: GIF -->
      <div class="animation3">
        <h3>Additional animation</h3>
        <div class="media">
          <img src="zonal_equator.gif"
               alt="Core flow animation">
        </div>
      </div>

    </div>

    <!-- Right column -->
    <div class="video-box-right">
      <h3>Zonal flow</h3>

      <video controls autoplay muted loop playsinline>
        <source src="zonal_animation.mp4"
                type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </div>

  </div>

</body>
</html>
